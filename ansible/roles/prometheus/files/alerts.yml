groups:
  - name: course
    rules:
      - alert: WebExporterDown
        expr: up{job="node"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'Node Exporter {{ $labels.instance }} is unavailable'
      - alert: WebServerHighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[2m]))) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Web server CPU utilization exceeds 80%'
