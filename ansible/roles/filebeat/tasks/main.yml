---
- name: Find application containers
  ansible.builtin.command: "docker inspect {{ item }}"
  loop: "{{ service_containers | default([]) }}"
  register: application_containers
  changed_when: false

- name: Make application Docker logs available to Filebeat
  ansible.builtin.file:
    src: "{{ (item.stdout | from_json)[0].LogPath }}"
    dest: "/var/log/course/{{ item.item }}.log"
    state: link
  loop: "{{ application_containers.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Configure Filebeat
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /opt/course/filebeat.yml
    mode: '0600'
  no_log: true
  register: filebeat_config

- name: Configure Filebeat container
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/course/filebeat-compose.yml
    mode: '0644'

- name: Start Filebeat
  ansible.builtin.command: >-
    docker-compose -f /opt/course/filebeat-compose.yml up -d
    {{ '--force-recreate' if filebeat_config.changed else '' }}
  register: filebeat_start
  changed_when: "'Creating' in filebeat_start.stderr or 'Recreating' in filebeat_start.stderr"
